<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TED Talks 互动介绍</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="tag">Ideas Worth Spreading</p>
      <h1>TED Talks 互动介绍</h1>
      <p class="description">
        TED Talks 汇聚了来自科技、教育、设计、文化、商业等领域的精彩演讲。
        通过短小而有启发性的演讲，人们可以了解新观点、发现新灵感，并思考世界的更多可能性。
      </p>

      <div class="card">
        <h2>为什么 TED Talks 受欢迎？</h2>
        <ul>
          <li>内容简洁，适合快速了解一个主题。</li>
          <li>演讲者来自不同领域，观点丰富多元。</li>
          <li>适合学习英语、提升表达能力和拓展视野。</li>
        </ul>
      </div>

      <button id="checkButton" type="button">点击测试页面</button>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section class="vocabulary card" aria-labelledby="vocabulary-title">
      <p class="tag">English Classroom</p>
      <h2 id="vocabulary-title">Vocabulary Learning</h2>
      <p class="vocabulary-intro">通过 TED Talks 主题词汇，积累实用英语表达。</p>
      <div class="word-panel">
        <p class="word-index" id="wordIndex" aria-live="polite"></p>
        <h3 id="word" class="word"></h3>
        <p id="pronunciation" class="pronunciation"></p>
        <p id="partOfSpeech" class="part-of-speech"></p>
        <p id="meaning" class="meaning"></p>
        <div class="example-box">
          <span>Example</span>
          <p id="example" class="example"></p>
        </div>
      </div>
      <div class="vocabulary-controls">
        <button id="previousWord" type="button">← 上一个</button>
        <button id="nextWord" type="button">下一个 →</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
